<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>게임 포스터 + 설명서</title><style>
:root{--ink:#182624;--paper:#f5f3e8;--green:#16644e;--lime:#d9f36b}*{box-sizing:border-box}body{margin:0;background:#172925;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #ed9a30;outline-offset:4px}.shell{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 24px 88px}.stage{width:min(100%,calc((100dvh - 112px)*16/9));aspect-ratio:16/9;position:relative;container-type:inline-size;background:var(--paper);box-shadow:0 24px 90px #0004;overflow:hidden}.slide{height:100%;padding:5cqw 6cqw 4cqw;display:none;position:relative}.slide.active{display:flex;flex-direction:column}.tag{font-size:1.05cqw;letter-spacing:.12em;font-weight:750;color:var(--green);text-transform:uppercase;margin-bottom:1.4cqw}h1{font-size:3.8cqw;letter-spacing:-.055em;line-height:1.2;margin:0 0 1.3cqw;font-weight:850}h1 em{font-style:normal;color:var(--green)}.desc{font-size:1.5cqw;color:#52615b;margin:0 0 2.8cqw;line-height:1.5}.columns{display:flex;gap:3cqw;margin-top:1.1cqw}.columns article{flex:1;border-top:2px solid #c5cdc0;padding-top:1.3cqw}.num{font-size:1.1cqw;color:var(--green);font-weight:800}h3{font-size:2cqw;margin:1cqw 0 1.2cqw;letter-spacing:-.04em}p{font-size:1.55cqw;line-height:1.7;margin:0}.columns p{color:#52615b}.note{font-size:1.25cqw;line-height:1.65;margin-top:auto;padding-top:2cqw;color:#496155}.rows{display:flex;flex-direction:column}.rows>div{display:grid;grid-template-columns:28% 1fr;gap:2cqw;padding:1.12cqw 0;border-bottom:1px solid #d2d7c8;font-size:1.5cqw;line-height:1.5}.rows strong{color:var(--green)}.rows span{color:#3d4d47}.timeline .rows>div{padding:.65cqw 0;font-size:1.4cqw}.palettes{display:flex;gap:2.5cqw}.palettes article{flex:1}.swatches{display:flex;height:7cqw}.swatches span{flex:1}.palettes h3{margin:1.4cqw 0 .8cqw}.palettes p{font-size:1.35cqw}.palettes small{display:block;font-size:1cqw;margin-top:1cqw;color:#536159}.prompt{position:relative;background:#e8eddf;border-left:.4cqw solid var(--green);padding:1.7cqw 2cqw;flex:1;min-height:0}.prompt pre{white-space:pre-wrap;font:1.24cqw/1.65 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;margin:0;color:#243c32;height:100%;overflow:auto;padding-top:.5cqw}.copy{position:absolute;right:1.2cqw;top:-3.2cqw;border:0;background:var(--green);color:white;padding:.6cqw 1cqw;border-radius:.4cqw;font-size:1cqw}.promptslide .desc{margin-bottom:2.8cqw}.promptslide h1{font-size:3.3cqw}.cover{background:var(--green);color:var(--paper);justify-content:center}.cover .tag{color:var(--lime);margin-bottom:3cqw}.cover h1{font-size:6.3cqw;line-height:1.2;letter-spacing:-.065em}.cover h1 em{color:var(--lime)}.cover .desc{color:#d5e3cd;margin-top:1.6cqw}.coverline{font-size:2cqw;margin-top:1cqw}.coverline span{color:var(--lime);margin:0 1cqw}.coverhint{font-size:1.25cqw;margin-top:2cqw;color:#cfdfc9}.break{background:var(--lime)}.bigword{font-size:13cqw;line-height:1;font-weight:900;letter-spacing:-.08em;margin-top:1cqw;color:var(--green)}.bigword span{font-size:3cqw;margin-left:1cqw}.breaktext{margin-top:2cqw}.checklist{display:grid;gap:1.25cqw;margin-top:1cqw}.checklist label{display:flex;gap:1cqw;align-items:center;cursor:pointer;font-size:1.5cqw;line-height:1.5}.checklist input{accent-color:var(--green);width:1.7cqw;height:1.7cqw;flex-shrink:0}.checklist input:checked+span{color:#68816c;text-decoration:line-through}.speech{font-size:3.3cqw;line-height:1.8;letter-spacing:-.04em;margin-top:1cqw}.speech em{font-style:normal;color:var(--green);background:var(--lime);padding:0 .5cqw}.ending{background:#e9edda}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:white;max-width:calc(100% - 24px);white-space:nowrap}.controls button,.controls select{background:#294238;color:#f8f7ef;border:1px solid #799083;border-radius:8px;padding:10px 14px;font-size:14px}.controls button:disabled{opacity:.4;cursor:default}.controls select{max-width:240px}.progress{position:absolute;bottom:0;left:0;height:5px;background:var(--lime);transition:width .2s}.number{position:absolute;right:2cqw;bottom:1.3cqw;color:#657768;font-size:1cqw}.cover .number{color:#d3e6c9}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#fff;color:#164e3b;border-radius:8px;box-shadow:0 4px 25px #0004;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}dialog{border:0;border-radius:12px;padding:24px;max-width:90vw;background:var(--paper);color:var(--ink)}dialog p{font-size:16px}dialog button{margin-top:16px;padding:8px 16px}dialog::backdrop{background:#0008}.helptext{position:fixed;left:20px;bottom:29px;font-size:12px;color:#b9cfc1}.helptext button{background:none;color:inherit;border:0;text-decoration:underline}body.overview .shell{height:auto;display:block;padding:24px 24px 100px}body.overview .stage{width:100%;aspect-ratio:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;background:transparent;box-shadow:none;overflow:visible;container-type:normal}body.overview .slide{display:flex;aspect-ratio:16/9;background:var(--paper);container-type:inline-size;padding:3.5vw}.overview .progress{display:none}.overview .cover{background:var(--green)}.overview .break{background:var(--lime)}@media(max-width:750px){.shell{padding:8px 8px 100px}.stage{width:min(100%,calc((100dvh - 108px)*16/9))}.controls{gap:6px;bottom:18px;flex-wrap:wrap;justify-content:center;width:100%}.controls button,.controls select{font-size:12px;padding:9px}.controls select{max-width:170px}.helptext{display:none}body.overview .stage{grid-template-columns:1fr}body.overview .slide{padding:6vw}}@media print{@page{size:landscape;margin:0}body{background:white}.shell{display:block;padding:0;height:auto}.stage{display:block;width:100%;overflow:visible;box-shadow:none;aspect-ratio:auto;container-type:normal}.slide{display:flex!important;width:100vw;height:56.25vw;page-break-after:always;break-after:page;container-type:inline-size;background:var(--paper)!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.controls,.helptext,.copy,.progress,.toast,dialog{display:none!important}.cover{background:var(--green)!important}.break{background:var(--lime)!important}.prompt pre{overflow:visible}.number{display:block}}

/* Large classroom typography; concise content only. */
.tag,.desc,.note,.num,.coverhint{display:none}
.slide{padding:4.5cqw 5.5cqw 4cqw}
h1,.promptslide h1{font-size:4.1cqw;line-height:1.2;margin:0 0 3cqw}
.columns{gap:5cqw;margin-top:1cqw}
h3{font-size:2.8cqw;margin:1.2cqw 0 1.6cqw}
p,.columns p{font-size:2.5cqw;line-height:1.7;color:#263f35}
.columns article{padding-top:1cqw;border-top:3px solid #16644e}
.action{margin-top:auto;padding-top:2cqw;font-size:2.05cqw;font-weight:700;color:var(--green)}
.rows{margin-top:.3cqw;gap:.3cqw}
.rows>div{grid-template-columns:30% 1fr;gap:2cqw;padding:1.35cqw 0;font-size:2.25cqw;line-height:1.5}
.prompt{padding:1.8cqw 2cqw;flex:0 1 auto;margin-top:1.3cqw}
.prompt pre{font-size:2.05cqw;line-height:1.85;padding:0;overflow:auto}
.copy{font-size:1.4cqw;top:-4.3cqw;padding:.75cqw 1.3cqw}
.palettes{gap:3cqw;margin-top:2cqw}
.swatches{height:10cqw}
.palettes h3{font-size:2.8cqw;margin:2cqw 0 1.3cqw}
.palettes p{font-size:2cqw;color:#263f35}
.number{font-size:1.2cqw;bottom:1.2cqw}
</style></head><body><main class="shell"><div class="stage" aria-label="수업 슬라이드"></div></main><nav class="controls" aria-label="슬라이드 탐색"><button id="prev" aria-label="이전 슬라이드">← 이전</button><select id="jump" aria-label="슬라이드 선택"></select><button id="next" aria-label="다음 슬라이드">다음 →</button><button id="overview" aria-pressed="false">전체 보기</button><button id="full">전체 화면</button></nav><div class="helptext"><button id="help">사용 방법</button> · 방향키로 이동</div><div class="toast" role="status" aria-live="polite"></div><dialog><h2>교안 사용 방법</h2><p>← → 방향키 · Space: 다음 · Home/End: 처음/끝<br>F: 전체 화면 · O: 전체 보기 · Esc: 닫기<br>슬라이드 오른쪽 빈 곳 클릭: 다음 / 왼쪽 빈 곳: 이전<br>프롬프트 복사 버튼으로 조건을 복사하세요.<br>휴대폰에서는 가로로 돌리면 더 크게 볼 수 있어요.<br>브라우저 인쇄로 전체 슬라이드를 PDF로 저장할 수 있어요.</p><button id="closeHelp">닫기</button></dialog><script>
const slides=[{"tag": "", "title": "게임 포스터 + 설명서", "desc": "", "body": "<div class=\"columns\"><article><h3>포스터 1장</h3><p>A4 세로<br>게임 제목 · 대표 장면<br>한 줄 소개</p></article><article><h3>설명서 1장</h3><p>A4 세로<br>목표 · 조작 · 규칙<br>시작 · 다시 시작</p></article></div><div class=\"action\">게임을 만들던 AI 대화창에서 이어서 요청</div>", "theme": ""}, {"tag": "", "title": "포스터 생성 프롬프트", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">이 대화에서 만든 게임의 포스터 제작.\n• A4 세로 1장. 제목 크게, 대표 장면 크게.\n• 포함: 실제 게임 제목, 한 줄 소개, 제작자 별명 [별명].\n• 그림: [스타일]. 제목 글꼴: [글꼴 스타일].\n• 색상: [색 3개]. 참고 분위기: [게임 이름 + 특징].\n• 실제 게임 내용만 사용. 한글은 크고 선명하게.\n• QR은 생성하지 않고, 실제 QR을 넣을 공간만 확보.</pre></div>", "theme": "promptslide"}, {"tag": "", "title": "포스터 스타일 ①", "desc": "", "body": "<div class=\"rows\"><div><strong>레트로 픽셀아트</strong><span>네모난 픽셀 · 도트 캐릭터 · 오락실</span></div><div><strong>웹소설 표지</strong><span>주인공 중심 · 극적인 빛 · 큰 제목</span></div><div><strong>캐주얼</strong><span>귀여운 캐릭터 · 단순한 배경 · 밝은 색</span></div></div>", "theme": ""}, {"tag": "", "title": "포스터 스타일 ②", "desc": "", "body": "<div class=\"rows\"><div><strong>SF</strong><span>우주 · 로봇 · 금속 · 네온 조명</span></div><div><strong>호러</strong><span>안개 · 그림자 · 어두운 배경 · 미스터리</span></div><div><strong>3D</strong><span>입체 캐릭터 · 장난감 재질 · 부드러운 빛</span></div></div>", "theme": ""}, {"tag": "", "title": "제목 글꼴 스타일", "desc": "", "body": "<div class=\"rows\"><div><strong>웹소설 타이포</strong><span>굵은 한글 · 화려한 테두리 · 빛 효과</span></div><div><strong>도트</strong><span>픽셀처럼 각진 글자</span></div><div><strong>네온</strong><span>빛나는 간판 느낌</span></div><div><strong>둥근 글씨</strong><span>두껍고 둥근 형태</span></div><div><strong>굵은 고딕</strong><span>장식 없이 크고 선명한 글자</span></div></div>", "theme": ""}, {"tag": "", "title": "색상 팔레트", "desc": "", "body": "<div class=\"palettes\"><article><div class=\"swatches\"><span style=\"background:#111827\"></span><span style=\"background:#7C3AED\"></span><span style=\"background:#5EEAD4\"></span></div><h3>우주 · SF</h3><p>남색 · 보라 · 민트</p></article><article><div class=\"swatches\"><span style=\"background:#FFF4D6\"></span><span style=\"background:#F472B6\"></span><span style=\"background:#38BDF8\"></span></div><h3>캐주얼</h3><p>크림 · 분홍 · 하늘</p></article><article><div class=\"swatches\"><span style=\"background:#173D32\"></span><span style=\"background:#EFE3C8\"></span><span style=\"background:#FACC15\"></span></div><h3>숲 · 모험</h3><p>초록 · 베이지 · 노랑</p></article></div>", "theme": ""}, {"tag": "", "title": "참고 게임 분위기", "desc": "", "body": "<div class=\"rows\"><div><strong>마인크래프트</strong><span>블록 형태 · 탐험 · 넓은 세계</span></div><div><strong>동물의 숲</strong><span>따뜻한 색 · 마을 · 편안한 분위기</span></div><div><strong>별의 커비</strong><span>둥근 형태 · 밝은 색 · 귀여운 모험</span></div><div><strong>어몽 어스</strong><span>우주선 · 단순한 형태 · 미스터리</span></div></div><div class=\"action\">분위기만 참고 · 캐릭터와 로고는 새롭게 제작</div>", "theme": ""}, {"tag": "", "title": "설명서 생성 프롬프트", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">이 대화에서 만든 게임의 설명서 제작.\n• A4 세로 1장. 짧은 문장, 큰 한글, 넉넉한 여백.\n• 포함: 제목, 목표, 시작 방법, 조작키와 동작,\n  핵심 규칙, 승리·실패 조건, 다시 시작 방법, 팁 2개.\n• 스타일: [설명서 스타일]. 제목과 색은 포스터와 통일.\n• 최종 게임의 실제 동작 기준. 모르는 내용은 먼저 질문.\n• QR은 생성하지 않고, 실제 QR을 넣을 공간만 확보.</pre></div>", "theme": "promptslide"}, {"tag": "", "title": "설명서 스타일", "desc": "", "body": "<div class=\"rows\"><div><strong>게임 공략집</strong><span>번호 순서 · 조작키 표 · 짧은 팁</span></div><div><strong>만화 안내서</strong><span>3~4칸 만화 · 한 칸에 한 행동</span></div><div><strong>깔끔한 안내문</strong><span>목표 → 조작 → 규칙 · 큰 글씨</span></div></div>", "theme": ""}, {"tag": "", "title": "수정 프롬프트", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">현재 결과물에서 아래 부분만 수정.\n• 대상: [포스터 / 설명서]\n• 수정: [제목을 더 크게 / 배경을 단순하게 /\n  한글 오류 수정 / 조작키를 실제 게임과 일치]\n• 나머지 내용과 A4 세로 규격 유지.</pre></div>", "theme": "promptslide"}];
const stage=document.querySelector('.stage');
stage.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme}" aria-label="${i+1}. ${s.title.replace(/<[^>]*>/g,'')}" aria-hidden="true"><div class="tag">${s.tag}</div><h1>${s.title}</h1><p class="desc">${s.desc}</p>${s.body}<span class="number">${String(i+1).padStart(2,'0')} / ${slides.length}</span></section>`).join('')+'<div class="progress"></div>';
const jump=document.querySelector('#jump');jump.innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.title.replace(/<[^>]*>/g,' ')}</option>`).join('');
let current=0,overview=false;
function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,n)=>{s.classList.toggle('active',n===current);s.setAttribute('aria-hidden',String(!overview&&n!==current))});jump.value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelector('.progress').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#slide-'+(current+1));document.title=`${current+1}/${slides.length} · ${slides[current].title.replace(/<[^>]*>/g,' ')} | 게임 디자인 수업`}
function overviewToggle(){overview=!overview;document.body.classList.toggle('overview',overview);document.querySelector('#overview').setAttribute('aria-pressed',String(overview));document.querySelector('#overview').textContent=overview?'슬라이드 보기':'전체 보기';show(current)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('이 브라우저에서는 전체 화면을 사용할 수 없어요.')}}
let toastTimer;function toast(t){const el=document.querySelector('.toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);jump.onchange=()=>show(+jump.value);document.querySelector('#overview').onclick=overviewToggle;document.querySelector('#full').onclick=fullscreen;
const dialog=document.querySelector('dialog');document.querySelector('#help').onclick=()=>dialog.showModal();document.querySelector('#closeHelp').onclick=()=>dialog.close();
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const pre=b.nextElementSibling;try{await navigator.clipboard.writeText(pre.textContent);toast('복사 완료 · 대괄호 수정 후 사용')}catch{const r=document.createRange();r.selectNodeContents(pre);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);toast('텍스트 선택 완료 · Ctrl+C 또는 ⌘C로 복사')}});
document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,select,pre')||(e.key===' '&&e.target.closest('button'))||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}else if(e.key.toLowerCase()==='o')overviewToggle();else if(e.key.toLowerCase()==='f')fullscreen()});
stage.onclick=e=>{if(e.target.closest('button,input,label,pre,a')||window.getSelection().toString())return;if(overview){const s=e.target.closest('.slide');if(s){current=[...document.querySelectorAll('.slide')].indexOf(s);overviewToggle()}return}const r=stage.getBoundingClientRect();show(current+(e.clientX-r.left<r.width*.28?-1:1))};
window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#slide-',''));if(Number.isInteger(n)&&n>0)show(n-1)});show((Number(location.hash.replace('#slide-',''))||1)-1);
</script></body></html>
