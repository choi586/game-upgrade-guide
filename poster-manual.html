<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>게임 포스터 + 설명서</title><style>
:root{--ink:#182624;--paper:#f5f3e8;--green:#16644e;--lime:#d9f36b}*{box-sizing:border-box}body{margin:0;background:#172925;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #ed9a30;outline-offset:4px}.shell{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 24px 88px}.stage{width:min(100%,calc((100dvh - 112px)*16/9));aspect-ratio:16/9;position:relative;container-type:inline-size;background:var(--paper);box-shadow:0 24px 90px #0004;overflow:hidden}.slide{height:100%;padding:5cqw 6cqw 4cqw;display:none;position:relative}.slide.active{display:flex;flex-direction:column}.tag{font-size:1.05cqw;letter-spacing:.12em;font-weight:750;color:var(--green);text-transform:uppercase;margin-bottom:1.4cqw}h1{font-size:3.8cqw;letter-spacing:-.055em;line-height:1.2;margin:0 0 1.3cqw;font-weight:850}h1 em{font-style:normal;color:var(--green)}.desc{font-size:1.5cqw;color:#52615b;margin:0 0 2.8cqw;line-height:1.5}.columns{display:flex;gap:3cqw;margin-top:1.1cqw}.columns article{flex:1;border-top:2px solid #c5cdc0;padding-top:1.3cqw}.num{font-size:1.1cqw;color:var(--green);font-weight:800}h3{font-size:2cqw;margin:1cqw 0 1.2cqw;letter-spacing:-.04em}p{font-size:1.55cqw;line-height:1.7;margin:0}.columns p{color:#52615b}.note{font-size:1.25cqw;line-height:1.65;margin-top:auto;padding-top:2cqw;color:#496155}.rows{display:flex;flex-direction:column}.rows>div{display:grid;grid-template-columns:28% 1fr;gap:2cqw;padding:1.12cqw 0;border-bottom:1px solid #d2d7c8;font-size:1.5cqw;line-height:1.5}.rows strong{color:var(--green)}.rows span{color:#3d4d47}.timeline .rows>div{padding:.65cqw 0;font-size:1.4cqw}.palettes{display:flex;gap:2.5cqw}.palettes article{flex:1}.swatches{display:flex;height:7cqw}.swatches span{flex:1}.palettes h3{margin:1.4cqw 0 .8cqw}.palettes p{font-size:1.35cqw}.palettes small{display:block;font-size:1cqw;margin-top:1cqw;color:#536159}.prompt{position:relative;background:#e8eddf;border-left:.4cqw solid var(--green);padding:1.7cqw 2cqw;flex:1;min-height:0}.prompt pre{white-space:pre-wrap;font:1.24cqw/1.65 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;margin:0;color:#243c32;height:auto;overflow:visible;padding-top:.5cqw}.copy{position:absolute;right:1.2cqw;top:-3.2cqw;border:0;background:var(--green);color:white;padding:.6cqw 1cqw;border-radius:.4cqw;font-size:1cqw}.promptslide .desc{margin-bottom:2.8cqw}.promptslide h1{font-size:3.3cqw}.cover{background:var(--green);color:var(--paper);justify-content:center}.cover .tag{color:var(--lime);margin-bottom:3cqw}.cover h1{font-size:6.3cqw;line-height:1.2;letter-spacing:-.065em}.cover h1 em{color:var(--lime)}.cover .desc{color:#d5e3cd;margin-top:1.6cqw}.coverline{font-size:2cqw;margin-top:1cqw}.coverline span{color:var(--lime);margin:0 1cqw}.coverhint{font-size:1.25cqw;margin-top:2cqw;color:#cfdfc9}.break{background:var(--lime)}.bigword{font-size:13cqw;line-height:1;font-weight:900;letter-spacing:-.08em;margin-top:1cqw;color:var(--green)}.bigword span{font-size:3cqw;margin-left:1cqw}.breaktext{margin-top:2cqw}.checklist{display:grid;gap:1.25cqw;margin-top:1cqw}.checklist label{display:flex;gap:1cqw;align-items:center;cursor:pointer;font-size:1.5cqw;line-height:1.5}.checklist input{accent-color:var(--green);width:1.7cqw;height:1.7cqw;flex-shrink:0}.checklist input:checked+span{color:#68816c;text-decoration:line-through}.speech{font-size:3.3cqw;line-height:1.8;letter-spacing:-.04em;margin-top:1cqw}.speech em{font-style:normal;color:var(--green);background:var(--lime);padding:0 .5cqw}.ending{background:#e9edda}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:white;max-width:calc(100% - 24px);white-space:nowrap}.controls button,.controls select{background:#294238;color:#f8f7ef;border:1px solid #799083;border-radius:8px;padding:10px 14px;font-size:14px}.controls button:disabled{opacity:.4;cursor:default}.controls select{max-width:240px}.progress{position:absolute;bottom:0;left:0;height:5px;background:var(--lime);transition:width .2s}.number{position:absolute;right:2cqw;bottom:1.3cqw;color:#657768;font-size:1cqw}.cover .number{color:#d3e6c9}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#fff;color:#164e3b;border-radius:8px;box-shadow:0 4px 25px #0004;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}dialog{border:0;border-radius:12px;padding:24px;max-width:90vw;background:var(--paper);color:var(--ink)}dialog p{font-size:16px}dialog button{margin-top:16px;padding:8px 16px}dialog::backdrop{background:#0008}.helptext{position:fixed;left:20px;bottom:29px;font-size:12px;color:#b9cfc1}.helptext button{background:none;color:inherit;border:0;text-decoration:underline}body.overview .shell{height:auto;display:block;padding:24px 24px 100px}body.overview .stage{width:100%;aspect-ratio:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;background:transparent;box-shadow:none;overflow:visible;container-type:normal}body.overview .slide{display:flex;aspect-ratio:16/9;background:var(--paper);container-type:inline-size;padding:3.5vw}.overview .progress{display:none}.overview .cover{background:var(--green)}.overview .break{background:var(--lime)}@media(max-width:750px){.shell{padding:8px 8px 100px}.stage{width:min(100%,calc((100dvh - 108px)*16/9))}.controls{gap:6px;bottom:18px;flex-wrap:wrap;justify-content:center;width:100%}.controls button,.controls select{font-size:12px;padding:9px}.controls select{max-width:170px}.helptext{display:none}body.overview .stage{grid-template-columns:1fr}body.overview .slide{padding:6vw}}@media print{@page{size:landscape;margin:0}body{background:white}.shell{display:block;padding:0;height:auto}.stage{display:block;width:100%;overflow:visible;box-shadow:none;aspect-ratio:auto;container-type:normal}.slide{display:flex!important;width:100vw;height:56.25vw;page-break-after:always;break-after:page;container-type:inline-size;background:var(--paper)!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.controls,.helptext,.copy,.progress,.toast,dialog{display:none!important}.cover{background:var(--green)!important}.break{background:var(--lime)!important}.prompt pre{overflow:visible}.number{display:block}}

/* Large classroom typography; concise content only. */
.tag,.desc,.note,.num,.coverhint{display:none}
.slide{padding:4.5cqw 5.5cqw 4cqw}
h1,.promptslide h1{font-size:4.1cqw;line-height:1.2;margin:0 0 3cqw}
.columns{gap:5cqw;margin-top:1cqw}
h3{font-size:2.8cqw;margin:1.2cqw 0 1.6cqw}
p,.columns p{font-size:2.5cqw;line-height:1.7;color:#263f35}
.columns article{padding-top:1cqw;border-top:3px solid #16644e}
.action{margin-top:auto;padding-top:2cqw;font-size:2.05cqw;font-weight:700;color:var(--green)}
.rows{margin-top:.3cqw;gap:.3cqw}
.rows>div{grid-template-columns:30% 1fr;gap:2cqw;padding:1.35cqw 0;font-size:2.25cqw;line-height:1.5}
.prompt{padding:1.8cqw 2cqw;flex:0 0 auto;margin-top:1.3cqw}
.prompt pre{font-size:2.05cqw;line-height:1.85;padding:0;overflow:visible}
.copy{font-size:1.4cqw;top:-4.3cqw;padding:.75cqw 1.3cqw}
.palettes{gap:3cqw;margin-top:2cqw}
.swatches{height:10cqw}
.palettes h3{font-size:2.8cqw;margin:2cqw 0 1.3cqw}
.palettes p{font-size:2cqw;color:#263f35}
.number{font-size:1.2cqw;bottom:1.2cqw}

.exampleslide{padding:1.5cqw 4cqw 2cqw}
.exampleslide h1{display:none}
.examples{width:100%;height:100%;object-fit:contain}
.visualslide{padding:2.5cqw 5cqw 3cqw}
.visualslide h1{font-size:3.2cqw;margin-bottom:1.6cqw}
.samples{display:grid;grid-template-columns:1fr 1fr;gap:5cqw;min-height:0}
.samples article{min-width:0;display:flex;flex-direction:column;align-items:center}
.sample-image{width:30cqw;height:30cqw;background-repeat:no-repeat;border-radius:.5cqw}
.samples h3{font-size:2.7cqw;margin:1cqw 0 .8cqw;align-self:flex-start}
.samples .prompt{background:transparent;border:0;padding:0;margin:0;width:100%;position:relative}
.samples .prompt pre{font-size:2.3cqw;line-height:1.5;overflow:visible}
.samples .copy{font-size:1.1cqw;top:-3.3cqw;right:0;padding:.5cqw .7cqw}
.type-image{width:40cqw;height:26.666cqw}
.typoslide .samples{margin-top:1cqw}
.promptslide .prompt pre{font-size:2.5cqw;line-height:1.75}
.promptslide h1{margin-bottom:2.5cqw}
.manual-layout{display:grid;grid-template-columns:38% 1fr;gap:4cqw;min-height:0;flex:1}
.manual-image{background:url(assets/examples.png) right center/200% 100% no-repeat;height:38cqw}
.manual-requests h3{font-size:2.4cqw;margin:1cqw 0 3cqw}
.manual-requests .prompt{padding:1.1cqw;margin-bottom:3cqw}
.manual-requests .prompt pre{font-size:2cqw;line-height:1.6}
.manual-requests .copy{font-size:1.1cqw;top:-3cqw;padding:.4cqw .7cqw}

.prompt pre{height:auto;max-height:none;min-width:0;overflow:visible;overflow-wrap:anywhere}
</style></head><body><main class="shell"><div class="stage" aria-label="수업 슬라이드"></div></main><nav class="controls" aria-label="슬라이드 탐색"><button id="prev" aria-label="이전 슬라이드">← 이전</button><select id="jump" aria-label="슬라이드 선택"></select><button id="next" aria-label="다음 슬라이드">다음 →</button><button id="overview" aria-pressed="false">전체 보기</button><button id="full">전체 화면</button></nav><div class="helptext"><button id="help">사용 방법</button> · 방향키로 이동</div><div class="toast" role="status" aria-live="polite"></div><dialog><h2>교안 사용 방법</h2><p>← → 방향키 · Space: 다음 · Home/End: 처음/끝<br>F: 전체 화면 · O: 전체 보기 · Esc: 닫기<br>슬라이드 오른쪽 빈 곳 클릭: 다음 / 왼쪽 빈 곳: 이전<br>프롬프트 복사 버튼으로 조건을 복사하세요.<br>휴대폰에서는 가로로 돌리면 더 크게 볼 수 있어요.<br>브라우저 인쇄로 전체 슬라이드를 PDF로 저장할 수 있어요.</p><button id="closeHelp">닫기</button></dialog><script>
const slides=[{"tag": "", "title": "포스터 · 설명서 예시", "desc": "", "body": "<img class=\"examples\" src=\"assets/examples.png\" alt=\"가상 게임 별빛 탐험대의 A4 세로 포스터와 설명서 완성 예시\">", "theme": "exampleslide"}, {"tag": "", "title": "포스터 만들기", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">이 대화에서 만든 게임의 포스터를 만들 거야.\n규격은 A4 세로로 만들어줘.\n스타일은 [레트로 픽셀아트]로 해줘.\n타이포는 [도트 글씨]로 해줘.\n색은 [남색, 보라, 민트]를 사용해줘.\n게임 제목과 대표 장면을 크게 넣고,\n게임을 소개하는 짧은 문구도 넣어줘.</pre></div>", "theme": "promptslide"}, {"tag": "", "title": "그림 스타일", "desc": "", "body": "<div class=\"samples\"><article><div role=\"img\" aria-label=\"레트로 픽셀아트 생성 예시\" class=\"sample-image \" style=\"background-image:url(assets/styles.png);background-size:300% 200%;background-position:0% 0%\"></div><h3>레트로 픽셀아트</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">옛날 오락실 게임처럼\n레트로 픽셀아트로 만들어줘.</pre></div></article><article><div role=\"img\" aria-label=\"웹소설 표지 생성 예시\" class=\"sample-image \" style=\"background-image:url(assets/styles.png);background-size:300% 200%;background-position:50% 0%\"></div><h3>웹소설 표지</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">판타지 웹소설 표지처럼\n주인공과 빛을 강조해줘.</pre></div></article></div>", "theme": "visualslide"}, {"tag": "", "title": "그림 스타일", "desc": "", "body": "<div class=\"samples\"><article><div role=\"img\" aria-label=\"캐주얼 생성 예시\" class=\"sample-image \" style=\"background-image:url(assets/styles.png);background-size:300% 200%;background-position:100% 0%\"></div><h3>캐주얼</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">밝은 색과 귀여운 캐릭터로\n캐주얼 게임 느낌을 내줘.</pre></div></article><article><div role=\"img\" aria-label=\"SF 생성 예시\" class=\"sample-image \" style=\"background-image:url(assets/styles.png);background-size:300% 200%;background-position:0% 100%\"></div><h3>SF</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">우주와 로봇이 등장하는\n미래적인 SF 스타일로 해줘.</pre></div></article></div>", "theme": "visualslide"}, {"tag": "", "title": "그림 스타일", "desc": "", "body": "<div class=\"samples\"><article><div role=\"img\" aria-label=\"호러 생성 예시\" class=\"sample-image \" style=\"background-image:url(assets/styles.png);background-size:300% 200%;background-position:50% 100%\"></div><h3>호러</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">안개와 그림자를 넣어\n으스스한 미스터리 느낌으로 해줘.</pre></div></article><article><div role=\"img\" aria-label=\"3D 생성 예시\" class=\"sample-image \" style=\"background-image:url(assets/styles.png);background-size:300% 200%;background-position:100% 100%\"></div><h3>3D</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">장난감처럼 둥글고 입체적인\n3D 스타일로 만들어줘.</pre></div></article></div>", "theme": "visualslide"}, {"tag": "", "title": "타이포 스타일", "desc": "", "body": "<div class=\"samples\"><article><div role=\"img\" aria-label=\"웹소설 타이포 생성 예시\" class=\"sample-image type-image\" style=\"background-image:url(assets/type.png);background-size:200% 200%;background-position:0% 0%\"></div><h3>웹소설 타이포</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">제목은 판타지 웹소설처럼\n화려한 타이포로 해줘.</pre></div></article><article><div role=\"img\" aria-label=\"도트 타이포 생성 예시\" class=\"sample-image type-image\" style=\"background-image:url(assets/type.png);background-size:200% 200%;background-position:100% 0%\"></div><h3>도트 타이포</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">제목은 네모난 픽셀로 만든\n도트 글씨로 해줘.</pre></div></article></div>", "theme": "visualslide typoslide"}, {"tag": "", "title": "타이포 스타일", "desc": "", "body": "<div class=\"samples\"><article><div role=\"img\" aria-label=\"네온 타이포 생성 예시\" class=\"sample-image type-image\" style=\"background-image:url(assets/type.png);background-size:200% 200%;background-position:0% 100%\"></div><h3>네온 타이포</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">제목은 네온 간판처럼\n파랑과 분홍으로 빛나게 해줘.</pre></div></article><article><div role=\"img\" aria-label=\"둥근 타이포 생성 예시\" class=\"sample-image type-image\" style=\"background-image:url(assets/type.png);background-size:200% 200%;background-position:100% 100%\"></div><h3>둥근 타이포</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">제목은 두껍고 둥글게,\n귀여운 글씨로 해줘.</pre></div></article></div>", "theme": "visualslide typoslide"}, {"tag": "", "title": "포스터로 썸네일 만들기", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">이 내용으로 썸네일도 만들어줘.\n가로 16:9 이미지로 만들어줘.\n포스터의 캐릭터, 색상, 타이포를 그대로 활용해줘.\n게임 제목과 대표 장면을 크게 넣어줘.\n작게 보여도 잘 보이도록 배경은 간단하게 해줘.</pre></div>", "theme": "promptslide"}, {"tag": "", "title": "설명서 만들기", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">이 대화에서 만든 게임의 설명서를 만들 거야.\nA4 세로 규격의 이미지 한 장으로 만들어줘.\n포스터와 같은 색과 제목 글씨를 사용해줘.\n게임 목표, 시작 방법, 조작키, 핵심 규칙,\n다시 시작하는 방법을 넣어줘.\n설명은 짧게 쓰고, 글자는 크게 해줘.\n실제 게임과 맞지 않는 내용은 넣지 말아줘.</pre></div>", "theme": "promptslide"}, {"tag": "", "title": "설명서 스타일", "desc": "", "body": "<div class=\"manual-layout\"><div class=\"manual-image\" role=\"img\" aria-label=\"깔끔한 게임 설명서 생성 예시\"></div><div class=\"manual-requests\"><h3>깔끔한 안내문</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">목표, 조작, 규칙을 나눠서\n깔끔한 안내문처럼 만들어줘.</pre></div><h3>게임 공략집</h3><div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">조작키는 표로 정리하고,\n팁을 넣어 공략집처럼 만들어줘.</pre></div></div></div>", "theme": "manualslide"}, {"tag": "", "title": "수정하기", "desc": "", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사</button><pre tabindex=\"0\">제목을 더 크게 만들어줘.\n배경 장식은 줄여줘.\n한글이 틀린 부분을 고쳐줘.\n나머지 디자인은 그대로 유지해줘.</pre></div>", "theme": "promptslide"}];
const stage=document.querySelector('.stage');
stage.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme}" aria-label="${i+1}. ${s.title.replace(/<[^>]*>/g,'')}" aria-hidden="true"><div class="tag">${s.tag}</div><h1>${s.title}</h1><p class="desc">${s.desc}</p>${s.body}<span class="number">${String(i+1).padStart(2,'0')} / ${slides.length}</span></section>`).join('')+'<div class="progress"></div>';
const jump=document.querySelector('#jump');jump.innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.title.replace(/<[^>]*>/g,' ')}</option>`).join('');
let current=0,overview=false;
function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,n)=>{s.classList.toggle('active',n===current);s.setAttribute('aria-hidden',String(!overview&&n!==current))});jump.value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelector('.progress').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#slide-'+(current+1));document.title=`${current+1}/${slides.length} · ${slides[current].title.replace(/<[^>]*>/g,' ')} | 게임 디자인 수업`}
function overviewToggle(){overview=!overview;document.body.classList.toggle('overview',overview);document.querySelector('#overview').setAttribute('aria-pressed',String(overview));document.querySelector('#overview').textContent=overview?'슬라이드 보기':'전체 보기';show(current)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('이 브라우저에서는 전체 화면을 사용할 수 없어요.')}}
let toastTimer;function toast(t){const el=document.querySelector('.toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);jump.onchange=()=>show(+jump.value);document.querySelector('#overview').onclick=overviewToggle;document.querySelector('#full').onclick=fullscreen;
const dialog=document.querySelector('dialog');document.querySelector('#help').onclick=()=>dialog.showModal();document.querySelector('#closeHelp').onclick=()=>dialog.close();
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const pre=b.nextElementSibling;try{await navigator.clipboard.writeText(pre.textContent);toast('복사 완료 · 대괄호 수정 후 사용')}catch{const r=document.createRange();r.selectNodeContents(pre);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);toast('텍스트 선택 완료 · Ctrl+C 또는 ⌘C로 복사')}});
document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,select,pre')||(e.key===' '&&e.target.closest('button'))||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}else if(e.key.toLowerCase()==='o')overviewToggle();else if(e.key.toLowerCase()==='f')fullscreen()});
stage.onclick=e=>{if(e.target.closest('button,input,label,pre,a')||window.getSelection().toString())return;if(overview){const s=e.target.closest('.slide');if(s){current=[...document.querySelectorAll('.slide')].indexOf(s);overviewToggle()}return}const r=stage.getBoundingClientRect();show(current+(e.clientX-r.left<r.width*.28?-1:1))};
window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#slide-',''));if(Number.isInteger(n)&&n>0)show(n-1)});show((Number(location.hash.replace('#slide-',''))||1)-1);
</script></body></html>
