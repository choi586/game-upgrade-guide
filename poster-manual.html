<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 게임의 첫인상을 만들자 | 포스터·설명서 수업</title><style>
:root{--ink:#182624;--paper:#f5f3e8;--green:#16644e;--lime:#d9f36b}*{box-sizing:border-box}body{margin:0;background:#172925;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:4px solid #ed9a30;outline-offset:4px}.shell{height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 24px 88px}.stage{width:min(100%,calc((100dvh - 112px)*16/9));aspect-ratio:16/9;position:relative;container-type:inline-size;background:var(--paper);box-shadow:0 24px 90px #0004;overflow:hidden}.slide{height:100%;padding:5cqw 6cqw 4cqw;display:none;position:relative}.slide.active{display:flex;flex-direction:column}.tag{font-size:1.05cqw;letter-spacing:.12em;font-weight:750;color:var(--green);text-transform:uppercase;margin-bottom:1.4cqw}h1{font-size:3.8cqw;letter-spacing:-.055em;line-height:1.2;margin:0 0 1.3cqw;font-weight:850}h1 em{font-style:normal;color:var(--green)}.desc{font-size:1.5cqw;color:#52615b;margin:0 0 2.8cqw;line-height:1.5}.columns{display:flex;gap:3cqw;margin-top:1.1cqw}.columns article{flex:1;border-top:2px solid #c5cdc0;padding-top:1.3cqw}.num{font-size:1.1cqw;color:var(--green);font-weight:800}h3{font-size:2cqw;margin:1cqw 0 1.2cqw;letter-spacing:-.04em}p{font-size:1.55cqw;line-height:1.7;margin:0}.columns p{color:#52615b}.note{font-size:1.25cqw;line-height:1.65;margin-top:auto;padding-top:2cqw;color:#496155}.rows{display:flex;flex-direction:column}.rows>div{display:grid;grid-template-columns:28% 1fr;gap:2cqw;padding:1.12cqw 0;border-bottom:1px solid #d2d7c8;font-size:1.5cqw;line-height:1.5}.rows strong{color:var(--green)}.rows span{color:#3d4d47}.timeline .rows>div{padding:.65cqw 0;font-size:1.4cqw}.palettes{display:flex;gap:2.5cqw}.palettes article{flex:1}.swatches{display:flex;height:7cqw}.swatches span{flex:1}.palettes h3{margin:1.4cqw 0 .8cqw}.palettes p{font-size:1.35cqw}.palettes small{display:block;font-size:1cqw;margin-top:1cqw;color:#536159}.prompt{position:relative;background:#e8eddf;border-left:.4cqw solid var(--green);padding:1.7cqw 2cqw;flex:1;min-height:0}.prompt pre{white-space:pre-wrap;font:1.24cqw/1.65 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;margin:0;color:#243c32;height:100%;overflow:auto;padding-top:.5cqw}.copy{position:absolute;right:1.2cqw;top:-3.2cqw;border:0;background:var(--green);color:white;padding:.6cqw 1cqw;border-radius:.4cqw;font-size:1cqw}.promptslide .desc{margin-bottom:2.8cqw}.promptslide h1{font-size:3.3cqw}.cover{background:var(--green);color:var(--paper);justify-content:center}.cover .tag{color:var(--lime);margin-bottom:3cqw}.cover h1{font-size:6.3cqw;line-height:1.2;letter-spacing:-.065em}.cover h1 em{color:var(--lime)}.cover .desc{color:#d5e3cd;margin-top:1.6cqw}.coverline{font-size:2cqw;margin-top:1cqw}.coverline span{color:var(--lime);margin:0 1cqw}.coverhint{font-size:1.25cqw;margin-top:2cqw;color:#cfdfc9}.break{background:var(--lime)}.bigword{font-size:13cqw;line-height:1;font-weight:900;letter-spacing:-.08em;margin-top:1cqw;color:var(--green)}.bigword span{font-size:3cqw;margin-left:1cqw}.breaktext{margin-top:2cqw}.checklist{display:grid;gap:1.25cqw;margin-top:1cqw}.checklist label{display:flex;gap:1cqw;align-items:center;cursor:pointer;font-size:1.5cqw;line-height:1.5}.checklist input{accent-color:var(--green);width:1.7cqw;height:1.7cqw;flex-shrink:0}.checklist input:checked+span{color:#68816c;text-decoration:line-through}.speech{font-size:3.3cqw;line-height:1.8;letter-spacing:-.04em;margin-top:1cqw}.speech em{font-style:normal;color:var(--green);background:var(--lime);padding:0 .5cqw}.ending{background:#e9edda}.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;color:white;max-width:calc(100% - 24px);white-space:nowrap}.controls button,.controls select{background:#294238;color:#f8f7ef;border:1px solid #799083;border-radius:8px;padding:10px 14px;font-size:14px}.controls button:disabled{opacity:.4;cursor:default}.controls select{max-width:240px}.progress{position:absolute;bottom:0;left:0;height:5px;background:var(--lime);transition:width .2s}.number{position:absolute;right:2cqw;bottom:1.3cqw;color:#657768;font-size:1cqw}.cover .number{color:#d3e6c9}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#fff;color:#164e3b;border-radius:8px;box-shadow:0 4px 25px #0004;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}dialog{border:0;border-radius:12px;padding:24px;max-width:90vw;background:var(--paper);color:var(--ink)}dialog p{font-size:16px}dialog button{margin-top:16px;padding:8px 16px}dialog::backdrop{background:#0008}.helptext{position:fixed;left:20px;bottom:29px;font-size:12px;color:#b9cfc1}.helptext button{background:none;color:inherit;border:0;text-decoration:underline}body.overview .shell{height:auto;display:block;padding:24px 24px 100px}body.overview .stage{width:100%;aspect-ratio:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:18px;background:transparent;box-shadow:none;overflow:visible;container-type:normal}body.overview .slide{display:flex;aspect-ratio:16/9;background:var(--paper);container-type:inline-size;padding:3.5vw}.overview .progress{display:none}.overview .cover{background:var(--green)}.overview .break{background:var(--lime)}@media(max-width:750px){.shell{padding:8px 8px 100px}.stage{width:min(100%,calc((100dvh - 108px)*16/9))}.controls{gap:6px;bottom:18px;flex-wrap:wrap;justify-content:center;width:100%}.controls button,.controls select{font-size:12px;padding:9px}.controls select{max-width:170px}.helptext{display:none}body.overview .stage{grid-template-columns:1fr}body.overview .slide{padding:6vw}}@media print{@page{size:landscape;margin:0}body{background:white}.shell{display:block;padding:0;height:auto}.stage{display:block;width:100%;overflow:visible;box-shadow:none;aspect-ratio:auto;container-type:normal}.slide{display:flex!important;width:100vw;height:56.25vw;page-break-after:always;break-after:page;container-type:inline-size;background:var(--paper)!important;print-color-adjust:exact;-webkit-print-color-adjust:exact}.controls,.helptext,.copy,.progress,.toast,dialog{display:none!important}.cover{background:var(--green)!important}.break{background:var(--lime)!important}.prompt pre{overflow:visible}.number{display:block}}
</style></head><body><main class="shell"><div class="stage" aria-label="수업 슬라이드"></div></main><nav class="controls" aria-label="슬라이드 탐색"><button id="prev" aria-label="이전 슬라이드">← 이전</button><select id="jump" aria-label="슬라이드 선택"></select><button id="next" aria-label="다음 슬라이드">다음 →</button><button id="overview" aria-pressed="false">전체 보기</button><button id="full">전체 화면</button></nav><div class="helptext"><button id="help">사용 방법</button> · 방향키로 이동</div><div class="toast" role="status" aria-live="polite"></div><dialog><h2>교안 사용 방법</h2><p>← → 방향키 · Space: 다음 · Home/End: 처음/끝<br>F: 전체 화면 · O: 전체 보기 · Esc: 닫기<br>슬라이드 오른쪽 빈 곳 클릭: 다음 / 왼쪽 빈 곳: 이전<br>프롬프트 복사 버튼으로 조건을 복사하세요.<br>휴대폰에서는 가로로 돌리면 더 크게 볼 수 있어요.<br>브라우저 인쇄로 전체 슬라이드를 PDF로 저장할 수 있어요.</p><button id="closeHelp">닫기</button></dialog><script>
const slides=[{"tag": "GAME DESIGN LAB · 초등 4–6학년", "title": "내 게임의<br><em>첫인상을 만들자</em>", "desc": "AI 게임 제작 마무리 수업 · 120분", "body": "<div class=\"coverline\">A4 포스터 <span>＋</span> A4 설명서</div><p class=\"coverhint\">우리가 게임을 만들던 AI 대화창에서 이어서 시작해요.</p>", "theme": "cover"}, {"tag": "오늘의 미션", "title": "사람들이 해 보고 싶은 게임", "desc": "만든 게임을 다른 사람에게 소개하는 두 장을 완성해요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>포스터 1장</h3><p>“무슨 게임이지?”<br>제목 · 대표 장면 · 한 줄 소개</p></article><article><span class=\"num\">02</span><h3>설명서 1장</h3><p>“어떻게 하지?”<br>목표 · 조작 · 규칙 · 팁</p></article><article><span class=\"num\">03</span><h3>친구의 플레이</h3><p>친구가 설명서만 보고<br>게임을 시작하면 성공!</p></article></div>", "theme": ""}, {"tag": "수업 지도 · 120분", "title": "오늘은 이렇게 진행해요", "desc": "만들기 → 확인하기 → 고치기 → 함께 즐기기", "body": "<div class=\"rows\"><div><strong>00–10분 · 준비</strong><span>게임 실행 확인 · 기존 AI 대화창 열기</span></div><div><strong>10–25분 · 디자인 선택</strong><span>포스터 분위기 · 글꼴 · 색상 정하기</span></div><div><strong>25–50분 · 포스터</strong><span>조건 입력 · 생성 · 제목과 글자 확인</span></div><div><strong>50–55분 · 쉬는 시간</strong><span>눈 쉬기 · 자리 정리</span></div><div><strong>55–80분 · 설명서</strong><span>목표 · 조작 · 규칙 확인 후 생성</span></div><div><strong>80–100분 · 수정</strong><span>짝과 테스트 · 한 가지씩 수정</span></div><div><strong>100–115분 · 최종 검수</strong><span>A4 크기 · 한글 · 게임 주소 · QR 확인</span></div><div><strong>115–120분 · 전시</strong><span>두 장 제출 · 30초 게임 소개</span></div></div>", "theme": "timeline"}, {"tag": "준비 · 00–10분", "title": "게임을 만들던 대화창을 열어요", "desc": "게임 설명을 처음부터 다시 쓸 필요는 없어요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>게임 실행</h3><p>시작 → 플레이 → 끝까지<br>직접 한 번 해 봐요.</p></article><article><span class=\"num\">02</span><h3>최종 버전 확인</h3><p>제목 · 조작키 · 승리 조건이<br>현재 게임과 맞나요?</p></article><article><span class=\"num\">03</span><h3>같은 대화 이어 쓰기</h3><p>AI가 앞 내용을 모르면<br>최종 코드나 화면을 알려 줘요.</p></article></div>", "theme": ""}, {"tag": "결과물 규격", "title": "화면은 가로, 작품은 세로", "desc": "이 교안은 16:9 · 우리가 만들 두 작품은 A4 세로", "body": "<div class=\"rows\"><div><strong>포스터</strong><span>A4 세로 210 × 297 mm · 1장</span></div><div><strong>설명서</strong><span>A4 세로 210 × 297 mm · 1장</span></div><div><strong>한 세트처럼</strong><span>같은 게임 제목 · 비슷한 색과 글꼴</span></div><div><strong>인쇄 확인</strong><span>가장자리 여백 확보 · 잘리는 글자 없이</span></div></div><p class=\"note\">이미지로 만들 때는 A4 비율을 요청하고, 저장 후 실제 크기를 확인해요.</p>", "theme": ""}, {"tag": "디자인 선택 · 10–25분", "title": "스타일은 세 가지로 정해요", "desc": "선택 단어를 조합하면 AI가 원하는 모습을 더 잘 이해해요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>그림 분위기</h3><p>레트로 픽셀아트<br>웹소설 표지 · 캐주얼<br>SF · 호러 · 3D</p></article><article><span class=\"num\">02</span><h3>제목 글꼴</h3><p>웹소설 타이포 · 도트<br>네온 · 둥근 글씨<br>굵은 고딕 · 금속 느낌</p></article><article><span class=\"num\">03</span><h3>색상</h3><p>주요 색 2개<br>포인트 색 1개<br>글자가 잘 보이는 배경</p></article></div><p class=\"note\">예: 레트로 픽셀아트 + 도트 제목 + 남색·보라·민트</p>", "theme": ""}, {"tag": "포스터 스타일 ①", "title": "모험? 이야기? 귀여움?", "desc": "같은 게임도 그림 분위기에 따라 첫인상이 달라져요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>레트로 픽셀아트</h3><p>네모난 픽셀 · 도트 캐릭터<br>옛날 오락실 · 선명한 대비</p></article><article><span class=\"num\">02</span><h3>웹소설 표지</h3><p>주인공을 크게 · 빛나는 배경<br>이야기가 느껴지는 구도</p></article><article><span class=\"num\">03</span><h3>캐주얼</h3><p>둥글고 귀여운 모습<br>단순한 배경 · 밝은 색</p></article></div>", "theme": ""}, {"tag": "포스터 스타일 ②", "title": "미래? 미스터리? 입체감?", "desc": "내 게임과 어울리는 단어를 골라요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>SF</h3><p>우주 · 로봇 · 홀로그램<br>차가운 금속 · 네온 조명</p></article><article><span class=\"num\">02</span><h3>호러</h3><p>안개 · 그림자 · 미스터리<br>어둡지만 글자는 또렷하게<br>잔인한 장면은 빼기</p></article><article><span class=\"num\">03</span><h3>3D</h3><p>장난감 같은 입체 캐릭터<br>부드러운 빛 · 둥근 재질</p></article></div>", "theme": ""}, {"tag": "제목 글꼴", "title": "제목은 개성 있게, 설명은 또렷하게", "desc": "아래 단어는 요청 예시예요. 실제 폰트 이름은 아니에요.", "body": "<div class=\"rows\"><div><strong>웹소설 타이포</strong><span>굵고 극적인 한글 제목 · 빛과 테두리 효과</span></div><div><strong>도트 글꼴</strong><span>픽셀처럼 각진 글자 · 레트로 게임 분위기</span></div><div><strong>네온 글꼴</strong><span>빛나는 간판 느낌 · 어두운 배경에 포인트</span></div><div><strong>둥근 글꼴</strong><span>친근하고 귀여운 인상 · 캐주얼 게임</span></div><div><strong>굵은 고딕</strong><span>멀리서도 보이는 힘 있는 제목</span></div></div><p class=\"note\">본문에는 장식을 줄여요. 한글이 깨지면 글자를 따로 얹는 방법으로 수정해요.</p>", "theme": ""}, {"tag": "색상 팔레트", "title": "세 가지 색으로 통일해요", "desc": "각 색 띠는 실제 색상 예시예요.", "body": "<div class=\"palettes\"><article><div class=\"swatches\"><span style=\"background:#111827\"></span><span style=\"background:#7C3AED\"></span><span style=\"background:#5EEAD4\"></span></div><h3>우주 탐험</h3><p>남색 + 보라 + 민트</p><small>#111827 · #7C3AED · #5EEAD4</small></article><article><div class=\"swatches\"><span style=\"background:#FFF4D6\"></span><span style=\"background:#F472B6\"></span><span style=\"background:#38BDF8\"></span></div><h3>달콤한 모험</h3><p>크림 + 분홍 + 하늘</p><small>#FFF4D6 · #F472B6 · #38BDF8</small></article><article><div class=\"swatches\"><span style=\"background:#173D32\"></span><span style=\"background:#EFE3C8\"></span><span style=\"background:#FACC15\"></span></div><h3>숲속 미스터리</h3><p>짙은 초록 + 베이지 + 노랑</p><small>#173D32 · #EFE3C8 · #FACC15</small></article></div><p class=\"note\">밝은 배경에는 어두운 글자, 어두운 배경에는 밝은 글자를 써요.</p>", "theme": ""}, {"tag": "참고 게임 분위기", "title": "좋아하는 느낌을 말로 바꿔요", "desc": "게임 이름에 더해, 어떤 점을 원하는지 설명해요.", "body": "<div class=\"rows\"><div><strong>마인크래프트 같은 탐험감</strong><span>블록 느낌 · 넓은 세계 · 발견하는 즐거움</span></div><div><strong>동물의 숲 같은 포근함</strong><span>따뜻한 색 · 평화로운 마을 · 편안한 일상</span></div><div><strong>별의 커비 같은 발랄함</strong><span>둥근 형태 · 밝은 색 · 귀여운 모험</span></div><div><strong>어몽 어스 같은 우주 분위기</strong><span>단순한 우주선 · 미스터리 · 선명한 대비</span></div></div><p class=\"note\">분위기만 참고해요. 기존 캐릭터·로고·포스터를 그대로 베끼지 않아요.</p>", "theme": ""}, {"tag": "포스터 구성", "title": "가장 먼저 보일 것은 게임 제목", "desc": "내용은 짧게, 대표 장면은 크게 보여 줘요.", "body": "<div class=\"rows\"><div><strong>위쪽 · 제목</strong><span>가장 큰 글씨 · 실제 게임과 같은 이름</span></div><div><strong>가운데 · 대표 장면</strong><span>주인공 또는 핵심 플레이 장면 하나</span></div><div><strong>아래쪽 · 한 줄 소개</strong><span>무엇을 하는 게임인지 한 문장으로</span></div><div><strong>맨 아래 · 참여 안내</strong><span>제작자 별명 · 확인한 게임 주소 또는 QR 자리</span></div></div><p class=\"note\">없는 기능을 넣지 않아요. 이름·학교·연락처 같은 개인정보는 넣지 않아요.</p>", "theme": ""}, {"tag": "포스터 만들기 · 25–50분", "title": "포스터 프롬프트", "desc": "[대괄호] 부분을 고른 단어로 바꾼 뒤, 게임을 만들던 창에 붙여 넣어요.", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사 ↗</button><pre tabindex=\"0\">이 대화에서 완성한 게임의 홍보 포스터를 만들어 줘.\n• 규격: A4 세로(210×297mm), 1장. 인쇄 여백을 확보해 줘.\n• 포함: 실제 게임 제목, 대표 장면, 짧은 홍보 문구 1개, 제작자 별명 [별명].\n• 그림 스타일: [레트로 픽셀아트 / 웹소설 표지 / 캐주얼 / SF / 호러 / 3D 중 선택].\n• 제목 글꼴 느낌: [웹소설 타이포 / 도트 / 네온 / 둥근 글씨 중 선택].\n• 색상: [주요 색 2개 + 포인트 색 1개]. 본문은 읽기 쉬운 한글로.\n• 참고 분위기: [참고 게임 이름 + 원하는 특징]. 캐릭터와 로고는 새롭게.\n• 게임에 없는 기능·캐릭터·수상 기록을 만들지 말아 줘.\n• QR코드는 그리지 말고, 아래쪽에 실제 QR을 넣을 빈 공간만 남겨 줘.\n이미지를 만들 수 있으면 제작하고, 어렵다면 편집 가능한 A4 HTML로 만들어 줘.</pre></div>", "theme": "promptslide"}, {"tag": "선택 예시", "title": "이렇게 조합할 수 있어요", "desc": "게임 줄거리를 다시 적지 않고, 디자인 조건만 더해요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>우주 점프 게임</h3><p>그림: SF + 픽셀아트<br>제목: 네온 도트<br>색: 남색 · 보라 · 민트</p></article><article><span class=\"num\">02</span><h3>숲속 수집 게임</h3><p>그림: 캐주얼 3D<br>제목: 둥글고 굵게<br>색: 초록 · 크림 · 노랑</p></article><article><span class=\"num\">03</span><h3>성 탈출 게임</h3><p>그림: 웹소설 표지<br>제목: 굵은 판타지 타이포<br>색: 짙은 파랑 · 금색 · 흰색</p></article></div><p class=\"note\">내 선택을 한 문장으로 말해 봐요: “나는 ___ 느낌으로 만들 거야.”</p>", "theme": ""}, {"tag": "잠깐 쉬기 · 50–55분", "title": "눈을 쉬고, 작품을 다시 봐요", "desc": "화면에서 눈을 떼고 몸을 가볍게 움직여요.", "body": "<div class=\"bigword\">5<span>분</span></div><p class=\"breaktext\">돌아오면 제목이 잘 읽히는지 먼저 확인해요.</p>", "theme": "break"}, {"tag": "설명서 만들기 · 55–80분", "title": "처음 하는 친구도 시작할 수 있게", "desc": "게임을 직접 해 보며 사실부터 확인해요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>목표와 시작</h3><p>무엇을 하면 성공할까?<br>어디를 눌러 시작할까?</p></article><article><span class=\"num\">02</span><h3>조작과 규칙</h3><p>어떤 키를 누를까?<br>점수 · 승리 · 실패는 언제?</p></article><article><span class=\"num\">03</span><h3>플레이 팁</h3><p>처음에 알면 좋은 것 2개<br>다시 시작하는 방법</p></article></div><p class=\"note\">현재 게임에 없는 규칙은 빼요. AI가 기억한 내용도 직접 확인해요.</p>", "theme": ""}, {"tag": "설명서 스타일", "title": "잘 읽히는 방식으로 골라요", "desc": "포스터와 색을 맞추고, 설명 글은 더 단순하게 써요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>게임 공략집</h3><p>번호가 있는 순서<br>조작키 표 · 짧은 팁</p></article><article><span class=\"num\">02</span><h3>만화 안내서</h3><p>3~4칸의 짧은 설명<br>말풍선 · 한 칸에 한 행동</p></article><article><span class=\"num\">03</span><h3>깔끔한 안내문</h3><p>큰 제목 · 넉넉한 여백<br>목표 → 조작 → 규칙</p></article></div><p class=\"note\">추천 조합: 포스터는 개성 있게 + 설명서는 깔끔한 안내문</p>", "theme": ""}, {"tag": "설명서 프롬프트", "title": "게임의 실제 동작을 기준으로", "desc": "복사 → [대괄호] 수정 → 같은 AI 대화창에 붙여 넣기", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사 ↗</button><pre tabindex=\"0\">이 대화에서 완성한 게임의 설명서를 만들어 줘.\n• 규격: A4 세로(210×297mm), 1장. 초등 4~6학년이 읽기 쉽게.\n• 현재 게임의 최종 코드와 동작을 기준으로 작성해 줘.\n• 포함: 게임 제목, 목표 1문장, 시작 방법, 조작키와 동작,\n  핵심 규칙, 승리·실패 조건(있는 경우), 다시 시작 방법, 팁 2개.\n• 설명서 스타일: [게임 공략집 / 만화 안내서 / 깔끔한 안내문].\n• 포스터와 제목·주요 색을 맞추고, 본문은 장식 없는 큰 한글로 써 줘.\n• 한 문장을 짧게 쓰고, 번호·조작키 표·충분한 여백으로 정리해 줘.\n• 확인되지 않은 조작·규칙·기능은 추측하지 말고 먼저 질문해 줘.\n• 제작자 별명 [별명]. 개인정보는 제외해 줘.\n• QR코드는 그리지 말고 실제 QR을 넣을 빈 공간만 남겨 줘.\n이미지를 만들 수 있으면 제작하고, 어렵다면 편집 가능한 A4 HTML로 만들어 줘.</pre></div>", "theme": "promptslide"}, {"tag": "수정 · 80–100분", "title": "한 번에 한 가지씩 고쳐요", "desc": "바꿀 곳과 바꾸는 방법을 구체적으로 말해요.", "body": "<div class=\"rows\"><div><strong>글자가 작아요</strong><span>“게임 제목을 더 크게 하고 배경 장식을 줄여 줘.”</span></div><div><strong>한글이 깨져요</strong><span>“그림은 유지하고, 한글을 편집 가능한 텍스트로 따로 넣어 줘.”</span></div><div><strong>설명이 달라요</strong><span>“실제 이동키는 방향키야. 조작 표만 정확하게 고쳐 줘.”</span></div><div><strong>두 장이 안 어울려요</strong><span>“설명서의 제목 글꼴과 주요 색을 포스터에 맞춰 줘.”</span></div></div><p class=\"note\">“더 멋지게” 대신 “어디를, 어떻게” 바꿀지 말해요.</p>", "theme": ""}, {"tag": "수정 프롬프트", "title": "좋은 부분은 남기고, 필요한 곳만", "desc": "원하는 문장을 복사해 바꿔 써요.", "body": "<div class=\"prompt\"><button class=\"copy\" type=\"button\">프롬프트 복사 ↗</button><pre tabindex=\"0\">현재 디자인의 좋은 점은 유지하고 다음 부분만 수정해 줘.\n• 대상: [포스터 / 설명서]\n• 수정 위치: [제목 / 배경 / 조작 표 / 한 줄 소개]\n• 문제: [글자가 작음 / 한글 오류 / 내용이 실제 게임과 다름]\n• 바꿀 방법: [제목을 크게 / 배경을 단순하게 / 실제 조작키로 수정]\nA4 세로 1장 규격, 게임 제목, 다른 내용은 유지해 줘.\n완성 후 바뀐 내용을 짧게 알려 줘.</pre></div>", "theme": "promptslide"}, {"tag": "짝 테스트", "title": "친구는 설명서만 보고 플레이해요", "desc": "만든 사람은 먼저 설명하지 않고 지켜봐요.", "body": "<div class=\"columns\"><article><span class=\"num\">01</span><h3>1 · 바꾸기</h3><p>설명서와 게임을<br>짝에게 보여 줘요.</p></article><article><span class=\"num\">02</span><h3>2 · 해 보기</h3><p>시작 · 이동 · 목표 달성<br>막히는 곳을 찾아요.</p></article><article><span class=\"num\">03</span><h3>3 · 고치기</h3><p>“여기서 헷갈렸어.”<br>가장 중요한 것 하나 수정</p></article></div><p class=\"note\">피드백 문장: “___은 잘 보였어. ___을 더 알려 주면 좋겠어.”</p>", "theme": ""}, {"tag": "최종 검수 · 100–115분", "title": "출력하기 전, 직접 확인해요", "desc": "항목을 누르면 체크할 수 있어요.", "body": "<div class=\"checklist\"><label><input type=\"checkbox\"><span>두 작품 모두 A4 세로 1장이고, 글자가 잘리지 않아요.</span></label><label><input type=\"checkbox\"><span>제목·한글·맞춤법을 확인했고, 글자가 선명해요.</span></label><label><input type=\"checkbox\"><span>조작키·목표·규칙이 현재 게임과 같아요.</span></label><label><input type=\"checkbox\"><span>포스터와 설명서가 같은 게임의 세트처럼 보여요.</span></label><label><input type=\"checkbox\"><span>다른 작품을 그대로 베끼지 않았고, 개인정보가 없어요.</span></label><label><input type=\"checkbox\"><span>게임 주소와 QR을 다른 기기에서 직접 열어 봤어요.</span></label></div>", "theme": ""}, {"tag": "QR코드 주의사항", "title": "AI가 그린 QR은 사용하지 않아요", "desc": "모양이 비슷해도 게임으로 연결되지 않을 수 있어요.", "body": "<div class=\"rows\"><div><strong>① 실제 게임 주소 확정</strong><span>편집 화면·AI 대화 주소 대신, 다른 사람도 열 수 있는 플레이 주소</span></div><div><strong>② 실제 QR 생성</strong><span>확인한 주소를 QR 생성 도구에 입력 · 원본 파일 저장</span></div><div><strong>③ 마지막에 배치</strong><span>빈 공간에 넣기 · 찌그러뜨리거나 꾸미지 않기 · 주위 여백 남기기</span></div><div><strong>④ 스캔 테스트</strong><span>다른 기기에서 접속 · 인쇄물도 스캔 · 작은 글씨로 주소 함께 표기</span></div></div><p class=\"note\">공개 주소가 없으면 QR을 넣지 말고, 선생님과 게임 공유 방법부터 확인해요.</p>", "theme": ""}, {"tag": "전시 · 115–120분", "title": "우리 게임을 만나 보세요", "desc": "포스터와 설명서를 함께 제출하고, 30초로 소개해요.", "body": "<div class=\"speech\">“내 게임은 <em>___</em>입니다.<br><em>___</em>하는 게임이고,<br><em>___</em>이 가장 재미있어요.”</div><p class=\"note\">저장 이름 예시: 게임이름_포스터 · 게임이름_설명서<br>파일을 다시 열어 보고, 친구 한 명이 플레이할 수 있는지 확인해요.</p>", "theme": "ending"}];
const stage=document.querySelector('.stage');
stage.innerHTML=slides.map((s,i)=>`<section class="slide ${s.theme}" aria-label="${i+1}. ${s.title.replace(/<[^>]*>/g,'')}" aria-hidden="true"><div class="tag">${s.tag}</div><h1>${s.title}</h1><p class="desc">${s.desc}</p>${s.body}<span class="number">${String(i+1).padStart(2,'0')} / ${slides.length}</span></section>`).join('')+'<div class="progress"></div>';
const jump=document.querySelector('#jump');jump.innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.title.replace(/<[^>]*>/g,' ')}</option>`).join('');
let current=0,overview=false;
function show(i){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((s,n)=>{s.classList.toggle('active',n===current);s.setAttribute('aria-hidden',String(!overview&&n!==current))});jump.value=current;document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===slides.length-1;document.querySelector('.progress').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#slide-'+(current+1));document.title=`${current+1}/${slides.length} · ${slides[current].title.replace(/<[^>]*>/g,' ')} | 게임 디자인 수업`}
function overviewToggle(){overview=!overview;document.body.classList.toggle('overview',overview);document.querySelector('#overview').setAttribute('aria-pressed',String(overview));document.querySelector('#overview').textContent=overview?'슬라이드 보기':'전체 보기';show(current)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('이 브라우저에서는 전체 화면을 사용할 수 없어요.')}}
let toastTimer;function toast(t){const el=document.querySelector('.toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);jump.onchange=()=>show(+jump.value);document.querySelector('#overview').onclick=overviewToggle;document.querySelector('#full').onclick=fullscreen;
const dialog=document.querySelector('dialog');document.querySelector('#help').onclick=()=>dialog.showModal();document.querySelector('#closeHelp').onclick=()=>dialog.close();
document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const pre=b.nextElementSibling;try{await navigator.clipboard.writeText(pre.textContent);toast('복사했어요! 대괄호를 바꿔 사용하세요.')}catch{const r=document.createRange();r.selectNodeContents(pre);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);toast('텍스트를 선택했어요. Ctrl+C 또는 ⌘C로 복사하세요.')}});
document.addEventListener('keydown',e=>{if(dialog.open||e.target.closest('input,select,pre')||(e.key===' '&&e.target.closest('button'))||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}else if(e.key==='Home'){e.preventDefault();show(0)}else if(e.key==='End'){e.preventDefault();show(slides.length-1)}else if(e.key.toLowerCase()==='o')overviewToggle();else if(e.key.toLowerCase()==='f')fullscreen()});
stage.onclick=e=>{if(e.target.closest('button,input,label,pre,a')||window.getSelection().toString())return;if(overview){const s=e.target.closest('.slide');if(s){current=[...document.querySelectorAll('.slide')].indexOf(s);overviewToggle()}return}const r=stage.getBoundingClientRect();show(current+(e.clientX-r.left<r.width*.28?-1:1))};
window.addEventListener('hashchange',()=>{const n=Number(location.hash.replace('#slide-',''));if(Number.isInteger(n)&&n>0)show(n-1)});show((Number(location.hash.replace('#slide-',''))||1)-1);
</script></body></html>
